[package]
name = "tidal-stream"
version = "0.1.0"
edition = "2024"

[dependencies]
tidal-auth = { path = "../tidal-auth" }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "gzip"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
thiserror = "2"
