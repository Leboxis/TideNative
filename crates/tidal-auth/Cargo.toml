[package]
name = "tidal-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
tidal-core = { path = "../core" }
base64 = "0.23.1"
getrandom = "0.4.3"
open = "5"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "gzip", "http2", "json", "native-tls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util", "sync"] }
url = "2.5.9"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
